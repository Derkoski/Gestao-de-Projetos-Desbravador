name: desbravador-projetos

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: desbravador_projetos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d desbravador_projetos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=desbravador_projetos;Username=postgres;Password=postgres
    ports:
      - "5090:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
