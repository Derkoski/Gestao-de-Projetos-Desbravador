name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore backend/Desbravador.Projetos.slnx

      - name: Build
        run: dotnet build backend/Desbravador.Projetos.slnx --no-restore -c Release

      # Os testes de integração sobem um PostgreSQL com Testcontainers (o runner já tem Docker).
      - name: Testes unitários e de integração
        run: dotnet test backend/Desbravador.Projetos.slnx --no-build -c Release --logger "trx" --results-directory TestResults

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: TestResults

  frontend:
    name: Front-end (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test:coverage

      - name: Checagem de tipos e build
        run: npm run build

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Build das imagens do docker compose
        run: docker compose build
